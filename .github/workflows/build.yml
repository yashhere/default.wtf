name: Build Extensions

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build extensions
      run: npm run build
      
    - name: Package extensions
      run: npm run package
      
    - name: Upload Chrome extension
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension
        path: dist/chrome-extension.zip
        
    - name: Upload Firefox extension
      uses: actions/upload-artifact@v4
      with:
        name: firefox-extension
        path: dist/firefox-extension.zip
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          dist/chrome/
          dist/firefox/
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '*-extension'
        merge-multiple: true
        
    - name: Upload release assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: chrome-extension.zip
        asset_name: chrome-extension-v${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip
        
    - name: Upload Firefox release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: firefox-extension.zip
        asset_name: firefox-extension-v${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip